<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <div class="container">
        <h1>Профиль пользователя</h1>
        <form id="profileForm">
            <div class="form-group">
                <label for="name">Имя:</label>
                <input type="text" id="name" placeholder="Введите имя">
            </div>
            <div class="form-group">
                <label for="age">Возраст:</label>
                <input type="number" id="age" placeholder="Введите возраст">
            </div>
            <div class="form-group">
                <label for="city">Город:</label>
                <input type="text" id="city" placeholder="Введите город">
            </div>
            <div class="form-group">
                <label for="hobby">Хобби:</label>
                <input type="text" id="hobby" placeholder="Введите хобби">
            </div>
            
            <div class="buttons">
                <button type="submit" id="saveBtn">Сохранить</button>
                <button type="button" id="clearBtn">Очистить данные</button>
            </div>
        </form>
        
        <div class="profile-card" id="profileCard" style="display: none;">
            <h2>Информация о пользователе</h2>
            <div class="profile-info">
                <p><strong>Имя:</strong> <span id="displayName">—</span></p>
                <p><strong>Возраст:</strong> <span id="displayAge">—</span> лет</p>
                <p><strong>Город:</strong> <span id="displayCity">—</span></p>
                <p><strong>Хобби:</strong> <span id="displayHobby">—</span></p>
            </div>
        </div>
        <div id="errorMsg" class="error"></div>
    </div>
    <script src="profile.js"></script>
</body>
</html>
